name: Build Typst PDFs

on:
  push:
    paths:
      - "**/*.typ"
      - "**/img/**"
      - ".github/workflows/typst.yml"
  pull_request:
    paths:
      - "**/*.typ"
      - "**/img/**"
      - ".github/workflows/typst.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: typst-community/setup-typst@v5

      - name: Compile PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          while IFS= read -r -d '' file; do
            output="out/${file%.typ}.pdf"
            mkdir -p "$(dirname "$output")"
            typst compile --root . "$file" "$output"
          done < <(find . -type f -name "*.typ" \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -not -path "./out/*" \
            -print0)

      - uses: actions/upload-artifact@v7
        with:
          name: typst-pdfs
          path: out/**/*.pdf
