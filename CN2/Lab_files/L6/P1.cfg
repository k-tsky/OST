hostname P1
!
cdp run
!
line con 0
logging sync
!
no ip domain-lookup
!
 interface Loopback0
 ip address 172.16.255.1 255.255.255.255
 no shut
 !
 interface GigabitEthernet1
 description Link to PE1
 ip address 172.16.0.1 255.255.255.252
 cdp enable
 no shut
 !
 interface GigabitEthernet2
 description Link to P3
 ip address 172.16.0.5 255.255.255.252
 cdp enable
 no shut
 !
 end


router ospf 1

interface GigabitEthernet1
    ip ospf 1 area 0
!

interface GigabitEthernet2
  ip ospf 1 area 0
!

interface Lo0
    ip ospf 1 area 0

mpls label range 1000 1099

