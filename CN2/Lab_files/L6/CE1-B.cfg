hostname CE1-B
!
cdp run
!
line con 0
logging sync
!
no ip domain-lookup
!
interface GigabitEthernet1
description Link to PE1
ip address 172.16.1.6 255.255.255.252
cdp enable
no shut
!
interface GigabitEthernet2
ip address 10.100.0.1 255.255.255.0
cdp enable
no shut
!
end

router bgp 65001
bgp log-neighbor-changes
neighbor 172.16.1.5 remote-as 64512
!
address-family ipv4
network 10.100.0.0 mask 255.255.255.0

neighbor 172.16.1.5 activate
exit-address-family
!




