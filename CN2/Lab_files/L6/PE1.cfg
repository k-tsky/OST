hostname PE1
!
cdp run
!
ipv6 unicast-routing
!
line con 0
logging sync
!
no ip domain-lookup
!
interface Loopback0
ip address 172.16.255.4 255.255.255.255
no shut
!
interface GigabitEthernet1
description Link to P1
ip address 172.16.0.2 255.255.255.252
cdp enable
no shut
!
interface GigabitEthernet2
description Link to CE1-A
ip address 172.16.1.1 255.255.255.252
ipv6 address 2001:DB8:CE1A::1/64
ipv6 enable
cdp enable
no shut
!
interface GigabitEthernet3
description Link to CE1-B
ip address 172.16.1.5 255.255.255.252
cdp enable
no shut
!
end

router ospf 1

interface GigabitEthernet1
  ip ospf 1 area 0
  mpls ip

interface GigabitEthernet2
  ip ospf 1 area 0

interface GigabitEthernet3
  ip ospf 1 area 0

interface Lo0
    ip ospf 1 area 0

mpls label range 1100 1199

vrf definition Cust_A
rd 172.16.255.4:65000
route-target export 1:1
route-target import 1:1
!
address-family ipv4
exit-address-family
!
address-family ipv6
exit-address-family
!
vrf definition Cust_B
rd 172.16.255.4:65001
route-target export 2:2
route-target import 2:2
!
address-family ipv4
exit-address-family

interface GigabitEthernet2
description Link to CE2-A
vrf forwarding Cust_A
ip address 172.16.1.1 255.255.255.252

!         
interface GigabitEthernet3
description Link to CE2-B
vrf forwarding Cust_B
ip address 172.16.1.5 255.255.255.252

router bgp 64512
bgp log-neighbor-changes
no bgp default ipv4-unicast
neighbor 172.16.255.5 remote-as 64512
neighbor 172.16.255.5 update-source Loopback0
!
address-family ipv4
exit-address-family
!
address-family vpnv4
  neighbor 172.16.255.5 activate
  neighbor 172.16.255.5 send-community extended
exit-address-family
!
address-family vpnv6
  neighbor 172.16.255.5 activate
  neighbor 172.16.255.5 send-community extended
exit-address-family
!


address-family ipv4 vrf Cust_A
  neighbor 172.16.1.2 remote-as 65000
  neighbor 172.16.1.2 activate
exit-address-family
!        
address-family ipv6 vrf Cust_A
  no neighbor 2001:DB8:CE1A::1 remote-as 65000
  no neighbor 2001:DB8:CE1A::1 activate
exit-address-family
!        
address-family ipv4 vrf Cust_B
  neighbor 172.16.1.6 remote-as 65001
  neighbor 172.16.1.6 activate
exit-address-family
