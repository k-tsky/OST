hostname CE1-A
!
cdp run
!
ipv6 unicast-routing
!
line con 0
logging sync
!
no ip domain-lookup
!
interface GigabitEthernet1
description Link to PE1
ip address 172.16.1.2 255.255.255.252
ipv6 address 2001:DB8:CE1A::2/64
ipv6 enable
cdp enable
no shut
!
interface GigabitEthernet2
ip address 10.60.0.1 255.255.255.0
ipv6 address 2001:DB8:1::1/64
ipv6 enable
cdp enable
no shut
!
interface GigabitEthernet3
ip address 10.60.2.1 255.255.255.0
cdp enable
no shut
!
end

! CE2-A
router bgp 65000
bgp log-neighbor-changes
neighbor 2001:DB8:CE1A::1 remote-as 64512
neighbor 172.16.1.1 remote-as 64512
!
address-family ipv4
network 10.60.0.0 mask 255.255.255.0
neighbor 172.16.1.1 activate
 exit-address-family
 !
 address-family ipv6
 network 2001:DB8:1::/64
 neighbor 2001:DB8:CE1A::1 activate
 exit-address-family
