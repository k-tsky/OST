router ospf 1
router-id 4.4.4.4
exit

interface GigabitEthernet1
    ip address 222.200.0.2 255.255.255.252
    no shutdown
    exit

interface GigabitEthernet2
    ip address 10.1.1.2 255.255.255.252
    ip ospf 1 area 0
    no shutdown
    exit

interface Lo0
    ip address 33.0.0.2 255.255.255.255
    ip ospf 1 area 0
    no shutdow
    exit

ip route 200.0.0.1 255.255.255.255 222.200.0.1

show ip ospf neighbor

router bgp 300
    neighbor 33.0.0.1 remote-as 300
    neighbor 33.0.0.1 update-source Loopback0
    exit
    
show ip bgp summary

router bgp 300
neighbor 200.0.0.1 remote-as 200
neighbor 200.0.0.1 ebgp-multihop 2
neighbor 200.0.0.1 update-source Loopback0
exit

router bgp 300
network 33.0.0.2 mask 255.255.255.255
network 222.200.0.0 mask 255.255.255.252
exit

router bgp 300
neighbor 33.0.0.1 next-hop-self