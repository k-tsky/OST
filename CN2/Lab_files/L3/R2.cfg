router ospf 1
router-id 2.2.2.2
exit

interface GigabitEthernet1
    ip address 111.100.0.2 255.255.255.252
    no shutdown
    exit

interface GigabitEthernet2
    ip address 10.1.1.1 255.255.255.252
    ip ospf 1 area 0
    no shutdown
    exit

interface Lo0
    ip address 33.0.0.1 255.255.255.255
    ip ospf 1 area 0
    no shutdown
    exit

ip route 100.0.0.1 255.255.255.255 111.100.0.1

show ip ospf neighbor

ping 33.0.0.2

router bgp 300
    neighbor 33.0.0.2 remote-as 300
    neighbor 33.0.0.2 update-source Loopback0
    exit

router bgp 300
    neighbor 100.0.0.1 remote-as 100
    neighbor 100.0.0.1 ebgp-multihop 2
    neighbor 100.0.0.1 update-source Loopback0
    exit

router bgp 300
    network 33.0.0.1 mask 255.255.255.255
    network 111.100.0.0 mask 255.255.255.252
    exit
    
router bgp 300
    neighbor 33.0.0.2 next-hop-self
    exit
