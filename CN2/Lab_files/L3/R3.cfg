interface GigabitEthernet1
    ip address 222.200.0.1 255.255.255.252
    no shutdown
    exit

interface Lo0
    ip address 200.0.0.1 255.255.255.255
    no shutdown
    exit

interface Lo1
    ip address 2.2.2.2 255.255.255.255
    no shutdown
    exit

interface GigabitEthernet2
    shutdown
    exit

ip route 33.0.0.2 255.255.255.255 222.200.0.2

router bgp 200
neighbor 33.0.0.2 remote-as 300
neighbor 33.0.0.2 ebgp-multihop 2
neighbor 33.0.0.2 update-source Loopback0
exit
200.0.0.1
router bgp 200
network 2.2.2.2 mask 255.255.255.255
network 222.200.0.0 mask 255.255.255.252
exit

interface GigabitEthernet2
ip address 100.200.0.2 255.255.255.252
no shutdown
exit

ip route 100.0.0.1 255.255.255.255 100.200.0.1

router bgp 200
neighbor 100.0.0.1 remote-as 100
neighbor 100.0.0.1 ebgp-multihop 2
neighbor 100.0.0.1 update-source Loopback0
network 100.200.0.0 mask 255.255.255.252

traceroute 1.1.1.1 source 33.0.0.2

conf t
access-list 1 permit 1.1.1.1 0.0.0.0
route-map SET-LOCAL-PREF permit 10
match ip address 1
set local-preference 150
route-map SET-LOCAL-PREF permit 20
router bgp 300
neighbor 200.0.0.1 route-map SET-LOCAL-PREF in

interface GigabitEthernet2
    shutdown
    exit

ping 1.1.1.1 source Lo1 2.2.2.2

ip as-path access-list 10 permit ^$ 