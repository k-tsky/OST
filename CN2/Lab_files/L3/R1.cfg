interface GigabitEthernet1
    ip address 111.100.0.1 255.255.255.252
    no shutdown
    exit

interface Lo0
    ip address 100.0.0.1 255.255.255.255
    no shutdown
    exit

interface Lo1
    ip address 1.1.1.1 255.255.255.255
    no shutdown
    exit

interface GigabitEthernet2
    shutdown
    exit

ip route 33.0.0.1 255.255.255.255 111.100.0.2


router bgp 100
    neighbor 33.0.0.1 remote-as 300
    neighbor 33.0.0.1 ebgp-multihop 2
    neighbor 33.0.0.1 update-source Loopback0
    exit

router bgp 100
    network 1.1.1.1 mask 255.255.255.255
    network 111.100.0.0 mask 255.255.255.252
    exit

interface GigabitEthernet2
    ip address 100.200.0.1 255.255.255.252
    no shutdown
    exit

ip route 200.0.0.1 255.255.255.255 100.200.0.2

router bgp 100
    neighbor 200.0.0.1 remote-as 200
    neighbor 200.0.0.1 ebgp-multihop 2
    neighbor 200.0.0.1 update-source Loopback0
    network 100.200.0.0 mask 255.255.255.252
