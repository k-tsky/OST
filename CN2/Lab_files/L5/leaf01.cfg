vlan 10
   name VLAN10
   exit

vlan 20
   name VLAN20
   exit

vlan 30
   name VLAN30
   exit

interface Vlan10
   ip address virtual 10.10.0.1/24
   exit

interface Vlan20
   ip address virtual 10.20.0.1/24
   exit
   
interface Vlan30
   ip address virtual 10.30.0.1/24
   exit

interface vxlan1
    vxlan source-interface Loopback1
    vxlan udp-port 4789
    vxlan vlan 10 vni 30010
    vxlan vlan 20 vni 30020
    vxlan vlan 30 vni 30030
    vxlan vlan 10 flood vtep 172.16.254.102 172.16.254.103 172.16.254.104
    vxlan vlan 20 flood vtep 172.16.254.102 172.16.254.103 172.16.254.104
    vxlan vlan 30 flood vtep 172.16.254.102 172.16.254.103 172.16.254.104
    vxlan learn-restrict any
    exit

ip virtual-router mac-address 50:01:00:00:02:34

interface Et33
   switchport mode trunk
   switchport trunk allowed vlan 10,20,30
   spanning-tree portfast trunk
   exit

router bgp 65120
   neighbor spines peer group
   neighbor spines remote-as 65120
   neighbor spines update-source Loopback0
   neighbor spines send-community extended
   neighbor 172.16.255.1 peer group spines
   neighbor 172.16.255.2 peer group spines
   !
   vlan 10
      rd auto
      route-target both 65120:20010
      redistribute learned
   !
   vlan 20
      rd auto
      route-target both 65120:20020
      redistribute learned
   !
   vlan 30
      rd auto
      route-target both 65120:20030
      redistribute learned
   !
   address-family evpn
      neighbor spines activate
!

