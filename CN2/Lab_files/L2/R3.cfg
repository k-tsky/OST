ipv6 unicast-routing
router isis
    net 49.0049.0000.0000.0003.00
    is-type level-1-2 
    log-adjacency-changes
    exit

interface GigabitEthernet1
    ip address 10.0.13.3 255.255.255.0
    ipv6 address 2001:db8:13::3/64
    ip router isis
    ipv6 router isis
    no shutdown
    exit

interface GigabitEthernet2
    ip address 10.0.23.3 255.255.255.0
    ipv6 address 2001:db8:23::3/64
    ip router isis
    ipv6 router isis
    no shutdow
    exit

interface GigabitEthernet3
    ip address 10.0.203.3 255.255.255.0
    ipv6 address 2001:db8:203::3/64
    ip router isis
    ipv6 router isis
    no shutdow
    exit