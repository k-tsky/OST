


ipv6 unicast-routing
router isis
 net 49.0051.0000.0000.0005.00
 is-type level-1-2 
 log-adjacency-changes
 exit

interface GigabitEthernet1
 ip address 10.0.102.5 255.255.255.0
 ipv6 address 2001:db8:102::5/64
 ip router isis
 ipv6 router isis
 no shutdown
 exit

interface GigabitEthernet2
 ip address 10.0.104.5 255.255.255.0
 ipv6 address 2001:db8:104::4/64
 ip router isis
 ipv6 router isis
 no shutdown
 exit

conf t

ip access-list standard LEAK_8888_ACL
permit 8.8.8.8
exit 

route-map LEAK_8888_RM permit 10
match ip address LEAK_8888_ACL
exit

router isis
redistribute isis ip level-2 into level-1 route-map LEAK_8888_RM
exit

ipv6 access-list LEAK_8_PXL_IPV6
permit 2001:db8::8/128 any
exit

route-map LEAK_8_RM_IPV6 permit 10
match ipv6 address LEAK_8_PXL_IPV6
exit 

router isis
address-family ipv6
redistribute isis level-2 into level-1 route-map LEAK_8_RM_IPV6
exit