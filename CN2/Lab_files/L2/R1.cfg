
ipv6 unicast-routing
router isis
    net 49.0049.0000.0000.0001.00
    is-type level-1 
    log-adjacency-changes
    exit

interface GigabitEthernet1
    ip address 10.0.12.1 255.255.255.0
    ipv6 address 2001:db8:12::1/64
    ip router isis
    ipv6 router isis
    no shutdown
    exit

interface GigabitEthernet2
    ip address 10.0.13.1 255.255.255.0
    ipv6 address 2001:db8:13::1/64
    ip router isis
    ipv6 router isis
    no shutdow
    exit

interface Lo0
    ip address 8.8.8.8 255.255.255.255
    ipv6 address 2001:db8::8no /128
    ip router isis
    ipv6 router isis
    no shutdow
    exit

interface Lo1
    ip address 1.1.1.1 255.255.255.255
    ipv6 address 2001:db8::1/128
    no shutdow
    exit


ip access-list standard REDIST_LO1_ACL
    permit 1.1.1.1
    exit

route-map REDIST_LO1_RM permit 10
    match ip address REDIST_LO1_ACL
    exit

router isis
    redistribute connected route-map REDIST_LO1_RM level-1
    exit


ipv6 prefix-list REDIST_LO1_PXL_IPV6 permit 2001:db8::1/128

route-map REDIST_LO1_RM_IPV6 permit 10
    match ipv6 address REDIST_LO1_PXL_IPV6
    exit

router isis
    address-family ipv6
    redistribute connected route-map REDIST_LO1_RM_IPV6 level-1
    exit