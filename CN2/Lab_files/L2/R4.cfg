


Example: R4

ipv6 unicast-routing
router isis
 net 49.0051.0000.0000.0004.00
 is-type level-1
 log-adjacency-changes
 exit

interface GigabitEthernet1
 ip address 10.0.104.4 255.255.255.0
 ipv6 address 2001:db8:104::4/64
 ip router isis
 ipv6 router isis
 no shutdown
 exit

interface GigabitEthernet2
 ip address 10.0.204.4 255.255.255.0
 ipv6 address 2001:db8:204::4/64
 ip router isis
 ipv6 router isis
 no shutdown
 exit

interface lo0
 ip address 4.4.4.4 255.255.255.255
 ipv6 address 2001:db8::4/128
 no shutdown
 exit 
